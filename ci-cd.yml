name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ] # Запуск при пуше в main
  workflow_dispatch:      # Позволяет запускать пайплайн кнопкой руками

# Права для GITHUB_TOKEN (нужны для пуша в Packages и публикации в Pages)
permissions:
  contents: read
  packages: write
  pages: write
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ==========================================
  # 1. BUILD & TEST
  # ==========================================
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lint / Test files
        run: |
          echo "Проверяем наличие файлов..."
          test -f index.html || exit 1
          test -f Dockerfile || exit 1
          echo "Всё на месте, тесты пройдены!"

  # ==========================================
  # 2. PUBLISH (в GHCR - GitHub Packages)
  # ==========================================
  publish:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # ==========================================
  # 3. DEPLOY (на GitHub Pages + Smoke Test образа)
  # ==========================================
  deploy:
    needs: publish
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 3.1. Smoke-тест (качаем образ из реестра и запускаем контейнер для проверки)
      - name: Test Docker Run from GHCR
        run: |
          echo "Скачиваем наш свежий образ..."
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          echo "Имя образа: $IMAGE"
          docker run -d -p 8080:80 --name test-app "$IMAGE"
          sleep 2
          curl -f http://localhost:8080 || (echo "Контейнер упал!" && exit 1)
          echo "Контейнер отдаёт 200 OK!"
          docker stop test-app

      # 3.2. Деплой сайта в GitHub Pages
      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.' # Папка, где лежит index.html

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
